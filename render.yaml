services:
  # Backend Web Service
  - type: web
    name: rolewise-backend
    env: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    region: oregon
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set this in Render dashboard for security

  # Frontend Static Site
  - type: static_site
    name: kalpesh-portfolio-web
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: rolewise-backend
          type: web
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
