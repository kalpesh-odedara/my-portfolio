services:
  # Backend Web Service
  - type: web
    name: rolewise-backend
    env: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    region: oregon
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set this in Render dashboard
        
  # Frontend Static Site
  - type: static
    name: rolewise-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: rolewise-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
